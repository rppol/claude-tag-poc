name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No pip install: the tests drive the real code path with fake clients,
      # so they need nothing but the standard library. Whole job runs in seconds.
      - run: python3 test_worker.py
