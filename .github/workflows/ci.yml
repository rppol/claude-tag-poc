name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; don't cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No pip install: the tests drive the real code path with fake clients,
      # so they need nothing but the standard library.
      - run: python3 test_worker.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Everything expensive happens here — Chromium for mermaid, font
      # downloads — so the published page fetches nothing at runtime.
      - run: ./tools/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
