name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# One Pages deployment at a time; don't cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No pip install: the tests drive the real code path with fake clients,
      # so they need nothing but the standard library.
      - name: backend — queue, lease, retry, transcript, mrkdwn
        run: python3 test_worker.py
      # The registry is load-bearing: the simulator executes it and the
      # architecture tab documents it. This fails if they can diverge, if an
      # irreversible write is `auto`, if slack.post_message ever appears, or if
      # a hand-written fixture cannot survive the real verifier.
      - name: registry — agents, tools, flows, fixtures
        run: node tools/check_registry.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Everything expensive happens here — Chromium for mermaid, font
      # downloads — so the published page fetches nothing at runtime.
      - run: ./tools/build.sh
      - name: prove the runtime-asset guard can fail
        run: ./tools/test_build_guard.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Only this job needs deploy credentials; test and build ran without them.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
